<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Kayıt Ol — SınavRotası</title>
  <script>
    // İlk açılışta kullanıcıyı önce tanıtım (onboarding) akışına yönlendir.
    try {
      if (!localStorage.getItem('sr_onboarding_seen_v1')) {
        window.location.replace('onboarding.html');
      }
    } catch (e) { /* localStorage yoksa sessizce devam et */ }
  </script>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-card-wrap">
      <div class="auth-brand">
        <img class="auth-brand-icon" src="images/logo-icon.png" alt="" width="60" height="60">
        <div class="auth-brand-word"><span class="w-navy">Sınav</span><span class="w-red">Rotası</span></div>
        <p class="auth-brand-tag">Kariyer Yolculuğuna Yön Ver</p>
      </div>

      <div class="auth-card">
        <div class="auth-heading">
          <h1>Hesap Oluştur</h1>
          <p>SınavRotası'na katıl ve başarı yolculuğuna başla.</p>
        </div>

        <form id="signupForm" class="auth-form" novalidate>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            <input type="text" id="signupName" placeholder="Ad Soyad" autocomplete="name" required>
          </div>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="email" id="signupEmail" placeholder="E-posta" autocomplete="email" required>
          </div>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="signupPassword" placeholder="Şifre (en az 8 karakter)" autocomplete="new-password" required minlength="8">
            <svg class="eye" data-toggle-for="signupPassword" viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="signupPasswordConfirm" placeholder="Şifreyi Onayla" autocomplete="new-password" required minlength="8">
            <svg class="eye" data-toggle-for="signupPasswordConfirm" viewBox="0 0 24 24" fill="none" stroke="#9AA5B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>

          <div class="terms">
            <input type="checkbox" id="signupTerms">
            <span><label for="signupTerms"><a href="terms.html" target="_blank" rel="noopener">Kullanım Koşulları</a> ve <a href="privacy.html" target="_blank" rel="noopener">Gizlilik Politikası</a>'nı kabul ediyorum</label></span>
          </div>

          <p class="auth-error" id="signupError"></p>
          <p class="auth-info" id="signupInfo"></p>
          <button class="primary-btn" type="submit" id="signupSubmit">Kayıt Ol</button>
        </form>

        <div class="divider"><div class="line"></div><span>veya şununla kayıt ol</span><div class="line"></div></div>
        <div class="socials">
          <button class="social-box" type="button" data-provider="google" aria-label="Google ile devam et"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.5-6.5C35.3 2.6 30 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.6 5.9C12.1 13 17.5 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 2.9-2.2 5.4-4.7 7.1l7.3 5.7c4.3-4 6.8-9.9 6.8-17.3z"/><path fill="#FBBC05" d="M10.1 19.1a14.5 14.5 0 0 0 0 9.7l-7.6 5.9a24 24 0 0 1 0-21.5z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.3-5.7c-2 1.4-4.7 2.2-8.7 2.2-6.5 0-12-4.4-13.9-10.3l-7.6 5.9C6.5 42.6 14.6 48 24 48z"/></svg></button>
          <button class="social-box" type="button" data-provider="apple" aria-label="Apple ile devam et"><svg viewBox="0 0 48 48"><path fill="#000" d="M33.4 25.3c0-5.5 4.5-8.1 4.7-8.3-2.6-3.8-6.6-4.3-8-4.4-3.4-.3-6.6 2-8.4 2-1.7 0-4.4-1.9-7.3-1.9-3.7.1-7.2 2.2-9.1 5.5-3.9 6.8-1 16.8 2.8 22.3 1.9 2.7 4.1 5.7 7 5.6 2.8-.1 3.9-1.8 7.3-1.8 3.4 0 4.3 1.8 7.3 1.7 3-.1 4.9-2.7 6.7-5.5 1.5-2.2 2.3-4.3 2.6-5.4-.1 0-5.6-2.1-5.6-8.8z"/><path fill="#000" d="M28.4 8.4c1.4-1.7 2.4-4.1 2.1-6.4-2.1.1-4.5 1.4-6 3.1-1.3 1.5-2.5 4-2.2 6.2 2.3.2 4.6-1.2 6.1-2.9z"/></svg></button>
          <button class="social-box" type="button" data-provider="azure" aria-label="Microsoft ile devam et"><svg viewBox="0 0 48 48"><rect x="4" y="4" width="18" height="18" fill="#F25022"/><rect x="26" y="4" width="18" height="18" fill="#7FBA00"/><rect x="4" y="26" width="18" height="18" fill="#00A4EF"/><rect x="26" y="26" width="18" height="18" fill="#FFB900"/></svg></button>
        </div>

        <div class="auth-switch">Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></div>
      </div>
    </div>
  </main>

  <script src="vendor/supabase/supabase.js"></script>
  <script src="vendor/capacitor/capacitor.js"></script>
  <script src="vendor/capacitor/app.js"></script>
  <script src="vendor/capacitor/haptics.js"></script>
  <script src="vendor/capacitor/status-bar.js"></script>
  <script src="vendor/capacitor/splash-screen.js"></script>
  <script src="vendor/capacitor/keyboard.js"></script>
  <script src="native-ux.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth-common.js"></script>
  <script src="signup.js"></script>
</body>
</html>
